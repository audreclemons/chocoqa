<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChocoQA Platform</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="demo-banner">
    ⚠️ Demo Environment — Fictitious data only. Not for production use.
  </div>

  <div class="container">
    <h1>ChocoQA Data Submission</h1>

    <form id="submitForm" autocomplete="off">
      <select id="productId" required>
        <option value="">Select Product</option>
      </select>

      <div id="specs" class="specs" hidden></div>

      <select id="ingredientId" required>
        <option value="">Select Ingredient</option>
      </select>

      <input
        type="number"
        id="percentage"
        placeholder="Percentage / PPM"
        step="0.01"
        required
      />

      <input
        type="number"
        id="temperature"
        placeholder="Temperature (°C)"
        step="0.1"
      />

      <input
        type="number"
        id="viscosity"
        placeholder="Viscosity"
        step="0.1"
      />

      <textarea
        id="data"
        placeholder="Additional QA Data"
        required
      ></textarea>

      <button type="submit">Submit</button>
    </form>
  </div>

  <script src="config.example.js"></script>
  <script src="app.js"></script>
</body>
</html>
